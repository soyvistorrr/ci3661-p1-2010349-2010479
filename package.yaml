name:                aventura
version:             0.1.0.0
synopsis:            Motor de Aventuras de Texto en Haskell
description:         Proyecto 1 para CI-3661 Laboratorio de Lenguajes de Programacion I (USB)
author:              Victor Hernandez (20-10349) y Angel Pacheco (20-10479)
maintainer:          20-10349@usb.ve, angelp@usb.ve
copyright:           2026 Universidad Simon Bolivar

dependencies:
  - base >= 4.14 && < 5
  - containers >= 0.6
  - directory >= 1.3
  - filepath >= 1.4

ghc-options:
  - -Wall
  - -Wcompat
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wredundant-constraints

library:
  source-dirs: src

executables:
  aventura:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - aventura

tests:
  aventura-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - aventura
      - HUnit >= 1.6